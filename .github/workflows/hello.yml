name: My First GitHub Actions Workflow

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hello-job:
    runs-on: ubuntu-latest

    env:
      APP_ENV: development
      APP_NAME: ${{ vars.APP_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Say hello
        run: echo "Hello from GitHub Actions!"

      - name: Read my file
        run: cat hello.txt

      - name: Show environment variables
        run: |
          echo "Environment: $APP_ENV"
          echo "App name: $APP_NAME"

      - name: Check repository secret
        env:
          DEMO_API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: |
          if [ -n "$DEMO_API_KEY" ]; then
            echo "Repository secret is configured."
          else
            echo "ERROR: Repository secret is missing."
            exit 1
          fi
